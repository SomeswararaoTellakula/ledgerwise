<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#f6f2e9"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker>
  </defs>
  <text x="30" y="42" font-size="24" font-weight="700" fill="#1d2433">Ledgerwise — where Hindsight sits</text>
  <text x="30" y="66" font-size="14" fill="#6b6f7a">Deterministic matching finds exceptions · Hindsight remembers how humans resolved them · policy decides when that memory is enough</text>

  <g font-size="14">
    <rect x="30" y="110" width="170" height="90" rx="10" fill="#fffdf8" stroke="#1d2433" stroke-width="1.5"/>
    <text x="115" y="145" text-anchor="middle" font-weight="600">Invoice + PO + GRN</text>
    <text x="115" y="168" text-anchor="middle" fill="#6b6f7a" font-size="12">vendor invoices arrive</text>

    <rect x="250" y="110" width="190" height="90" rx="10" fill="#fffdf8" stroke="#1d2433" stroke-width="1.5"/>
    <text x="345" y="140" text-anchor="middle" font-weight="600">3-way matcher</text>
    <text x="345" y="162" text-anchor="middle" fill="#6b6f7a" font-size="12">price · qty · GST · extra lines</text>
    <text x="345" y="180" text-anchor="middle" fill="#6b6f7a" font-size="12">duplicates · bank change</text>

    <rect x="490" y="95" width="230" height="120" rx="10" fill="#fffdf8" stroke="#1d2433" stroke-width="2"/>
    <text x="605" y="125" text-anchor="middle" font-weight="700">Precedent policy</text>
    <text x="605" y="148" text-anchor="middle" fill="#6b6f7a" font-size="12">≥2 consistent human decisions</text>
    <text x="605" y="166" text-anchor="middle" fill="#6b6f7a" font-size="12">magnitude inside learned range</text>
    <text x="605" y="184" text-anchor="middle" fill="#b3261e" font-size="12">bank change → always a human</text>
    <text x="605" y="202" text-anchor="middle" fill="#6b6f7a" font-size="12">never learns from its own calls</text>

    <rect x="780" y="80" width="190" height="60" rx="10" fill="#e2f1e8" stroke="#23764a" stroke-width="1.5"/>
    <text x="875" y="108" text-anchor="middle" font-weight="600" fill="#23764a">Auto-resolve</text>
    <text x="875" y="127" text-anchor="middle" font-size="12" fill="#23764a">approve · reject + email · pay GRN</text>

    <rect x="780" y="170" width="190" height="60" rx="10" fill="#fbe9d0" stroke="#a15c00" stroke-width="1.5"/>
    <text x="875" y="198" text-anchor="middle" font-weight="600" fill="#a15c00">Escalate to AP lead</text>
    <text x="875" y="217" text-anchor="middle" font-size="12" fill="#a15c00">with cited precedents + lean</text>

    <rect x="330" y="320" width="520" height="160" rx="14" fill="#f1eaf8" stroke="#6b3fa0" stroke-width="2"/>
    <text x="590" y="352" text-anchor="middle" font-weight="700" fill="#6b3fa0" font-size="17">Hindsight memory bank · ledgerwise-ap-*</text>
    <text x="590" y="376" text-anchor="middle" fill="#6b3fa0" font-size="12">disposition: skepticism 5 · literalism 4 · empathy 2</text>
    <text x="355" y="408" fill="#1d2433" font-size="13"><tspan font-weight="700">retain</tspan>  every human decision + reason (document_id = invoice:exception)</text>
    <text x="355" y="432" fill="#1d2433" font-size="13"><tspan font-weight="700">recall</tspan>  "how were X exceptions from vendor V resolved?" + source chunks</text>
    <text x="355" y="456" fill="#1d2433" font-size="13"><tspan font-weight="700">reflect</tspan>  vendor brief before the payment run</text>

    <rect x="30" y="360" width="250" height="80" rx="10" fill="#fffdf8" stroke="#1d2433" stroke-width="1.5"/>
    <text x="155" y="392" text-anchor="middle" font-weight="600">Groq LLM (optional)</text>
    <text x="155" y="414" text-anchor="middle" fill="#6b6f7a" font-size="12">writes notes + vendor emails only;</text>
    <text x="155" y="430" text-anchor="middle" fill="#6b6f7a" font-size="12">never makes the pay decision</text>
  </g>
  <path d="M200 155 H245" stroke="#1d2433" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M440 155 H485" stroke="#1d2433" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M720 130 L775 112" stroke="#1d2433" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M720 180 L775 198" stroke="#1d2433" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M590 315 V220" stroke="#6b3fa0" stroke-width="2" marker-end="url(#p)"/>
  <text x="598" y="275" fill="#6b3fa0" font-size="12" font-weight="600">recall</text>
  <path d="M875 232 V400 H856" stroke="#6b3fa0" stroke-width="2" marker-end="url(#p)" fill="none"/>
  <text x="883" y="320" fill="#6b3fa0" font-size="12" font-weight="600">retain human</text>
  <text x="883" y="336" fill="#6b3fa0" font-size="12" font-weight="600">decision + reason</text>
  <path d="M285 400 H325" stroke="#1d2433" stroke-width="1.2" stroke-dasharray="4 4"/>
</svg>
